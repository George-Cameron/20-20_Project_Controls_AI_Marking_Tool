# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Uses the standard Node runtime. LibreOffice is not available, so
# DOCX submissions fall back to text-only extraction via mammoth and
# the "Download Marked PDF" feature is disabled. For full-fidelity
# DOCX handling, run the Dockerfile locally or on a host with more
# resources.

services:
  - type: web
    name: 2020-pm-ai-marking-companion
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"

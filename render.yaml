# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Uses a Docker build so that LibreOffice is available at runtime
# for DOCX → PDF conversion. The Dockerfile installs libreoffice-writer
# on top of node:20-slim.

services:
  - type: web
    name: 2020-pm-ai-marking-companion
    runtime: docker
    plan: free
    envVars:
      # Must be set manually in the Render dashboard after first deploy.
      # Never commit the real key to git.
      - key: ANTHROPIC_API_KEY
        sync: false
